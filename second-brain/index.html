<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Danilo Second Brain</title>
<link id="tipi" rel="stylesheet" media="print" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link id="app" rel="stylesheet" href="app.css">
</head>
<body>
<div id="root"></div>
<script id="state" type="application/json"></script>
<script id="vmap" type="application/json"></script>
<script id="vgeo" type="application/json"></script>
<script id="boot">
(function(){
  function leggi(u){ return fetch(u).then(function(r){ if (!r.ok) throw new Error(u + ' ' + r.status); return r.text(); }); }
  Promise.all([leggi('state.json'), leggi('vmap.json'), leggi('vgeo.json')]).then(function(t){
    document.getElementById('state').textContent = t[0];
    document.getElementById('vmap').textContent = t[1];
    document.getElementById('vgeo').textContent = t[2];
    var s = document.createElement('script'); s.id = 'app-js'; s.src = 'app.js';
    s.onerror = function(){ document.getElementById('root').innerHTML = '<p style="font-family:sans-serif;padding:24px">Non riesco a caricare il codice della pagina (app.js). Ricarica; se persiste, dillo a Claude.</p>'; };
    document.body.appendChild(s);
  }).catch(function(e){
    document.getElementById('root').innerHTML = '<p style="font-family:sans-serif;padding:24px">Non riesco a caricare i dati della pagina: ' + String(e && e.message || e).replace(/</g, '&lt;') + '. Ricarica; se persiste, dillo a Claude.</p>';
  });
})();
</script>
</body>
</html>
